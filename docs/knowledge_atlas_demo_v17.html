<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>知序 · 知识地图侧边栏原型 v12</title>
<style>
  :root{--paper:#f6f2e9;--paper2:#f1ecdf;--canvas:#faf7ef;--surface:#fffdf8;--ink:#302e2a;--muted:#817e75;--line:#e5dfd2;--line2:#d8d0bf;--accent:#a96649;--accent2:#efdfd0;--sage:#668774;--sageBg:#eaf0e8;--blue:#607e92;--blueBg:#e8eef2;--plum:#8a7590;--plumBg:#f0e9f0;--gold:#ac8a51;--goldBg:#f5eedc;--shadow:0 14px 42px rgba(77,59,35,.06),0 2px 8px rgba(65,52,33,.035)}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;font-family:Inter,"SF Pro Display","PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--paper);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}

  .shell{height:100%;display:flex;flex-direction:column;padding:10px;gap:0;min-width:0}

  .workspace{min-height:0;min-width:0;flex:1;display:flex;position:relative}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;border-radius:16px;background:var(--canvas);border:1px solid #e9e1d3;overflow:hidden;box-shadow:var(--shadow);position:relative}
  .map-header{padding:16px 22px 13px;background:rgba(255,253,248,.88);border-bottom:1px solid #eae4d9;z-index:3;flex:0 0 auto}
  .head-top{display:flex;align-items:center;justify-content:space-between;gap:20px}.head-title{min-width:0}.head-title h1{font-size:23px;letter-spacing:-.65px;font-weight:760;margin:3px 0 7px}.head-sub{color:#918a7d;font-size:13px;line-height:1.55}.head-tools{display:flex;align-items:center;gap:7px;flex-shrink:0}
  .count-pill{font-size:11px;border:1px solid #ece2d1;color:#8a7c67;border-radius:99px;background:#faf5ec;padding:8px 11px}.count-pill strong{font-weight:750;color:#866047}
  .crumbbar{display:flex;align-items:center;gap:5px;margin-top:14px;white-space:nowrap;overflow:auto;scrollbar-width:none}.crumbbar::-webkit-scrollbar{display:none}.crumb{background:transparent;border:0;color:#aa9d8b;font-size:12px;padding:4px 5px;white-space:nowrap}.crumb:hover{color:#a56447}.crumb.current{color:#5f5549;font-weight:700}.chev{color:#c8bbab;font-size:13px;margin:0 2px}
  .map-wrap{position:relative;flex:1;min-height:0;overflow:hidden;background-color:#f8f5ed;background-image:radial-gradient(#d3cabb 0.85px,transparent 0.85px);background-size:23px 23px;cursor:grab;touch-action:none;user-select:none}.map-wrap.grabbing{cursor:grabbing}
  .map-scene{position:absolute;left:0;top:0;width:1140px;height:800px;transform-origin:0 0;will-change:transform;transition:transform .45s cubic-bezier(.22,.8,.2,1),opacity .22s;z-index:1}.map-scene.transition-ghost{z-index:3;pointer-events:none;filter:none}
  .group-area{position:absolute;border-radius:17px;border:1px solid rgba(151,125,94,.22);background:rgba(255,253,248,.52);box-shadow:0 1px 3px #6f60450a inset;pointer-events:none}
  .group-area:before{content:"";position:absolute;width:3px;height:32px;background:var(--group-color);opacity:.6;top:20px;left:-1px;border-radius:3px}.group-title{position:absolute;top:17px;left:22px;font-size:12px;color:#70675b;font-weight:720;letter-spacing:.4px}.group-title span{font:700 10px/1 Inter,system-ui,sans-serif;letter-spacing:1px;color:var(--group-color);margin-right:9px}.group-sub{position:absolute;right:20px;top:20px;font-size:10px;color:#aea293}
  .edges{position:absolute;width:100%;height:100%;pointer-events:none;overflow:visible}.edge{fill:none;stroke-width:2;opacity:.76;stroke-linecap:round;stroke-linejoin:round}.edge.secondary{stroke-width:1.8;stroke-dasharray:6 6;opacity:.58}.edge-label{font-size:10px;font-weight:630;fill:#796e60;paint-order:stroke;stroke:#faf7ef;stroke-width:6px;stroke-linejoin:round}
  .node{position:absolute;display:flex;align-items:flex-start;gap:11px;min-height:86px;padding:15px 15px 13px 14px;border-radius:13px;background:rgba(255,253,248,.98);border:1.5px solid var(--node-border);box-shadow:0 8px 25px #5f4d330d,0 2px 5px #5f4d3309;cursor:pointer;text-align:left;transition:box-shadow .16s,transform .16s,border-color .16s;user-select:none;color:#39352f}.node:hover{box-shadow:0 12px 27px #57432c20,0 0 0 3px var(--node-wash);border-color:var(--node-accent)}.node:active{transform:translateY(0)}.node:focus-visible{outline:3px solid #bd9e83;outline-offset:3px}
  /* Each visual connection has its own actual attachment point on the card border. */
  /* Ports are colored by direction, independent of each connection line. */
  .node-port{position:absolute;width:7px;height:7px;border-radius:50%;transform:translate(-50%,-50%);border:1px solid var(--port-color);background:var(--port-color);box-shadow:0 0 0 1.5px #fffdf8;pointer-events:none;z-index:3}
  .node-port.in{--port-color:#8699aa}
  .node-port.out{--port-color:#b38c97;background:#fffdf8;border-width:2px}
  .node-title,.node-desc{display:block}.node .node-icon{flex-shrink:0;display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--node-wash);color:var(--node-accent)}.node .node-icon svg{width:15px;height:15px;stroke-width:1.9}.node-copy{flex:1;min-width:0}.node-title{font-size:17px;font-weight:745;letter-spacing:-.3px;line-height:1.2}.node-desc{font-size:13px;color:#989083;line-height:1.5;margin-top:6px;white-space:normal}.node-foot{font-size:10.5px;color:var(--node-accent);font-weight:680;margin-top:10px;display:flex;align-items:center;gap:4px}.node-foot svg{width:11px;height:11px}.node .node-hint{position:absolute;right:10px;top:13px;color:#c6b9a6}.node .node-hint svg{width:13px;height:13px}.node.leaf{min-height:80px}.node.leaf .node-foot{color:#aaa092}
  .node.selected{border-color:var(--node-accent);box-shadow:0 0 0 3px var(--node-wash),0 15px 34px #604b3420}
  .floating-tag{position:absolute;display:flex;align-items:center;gap:6px;top:19px;left:22px;background:rgba(255,253,249,.94);border:1px solid #e9e1d6;border-radius:99px;padding:9px 13px;z-index:2;box-shadow:0 4px 15px #574a3610;color:#857766;font-size:12px;pointer-events:none}.floating-tag .tag-dot{width:7px;height:7px;background:#b47e5d;border-radius:50%}.floating-tag strong{color:#605449;font-weight:710}
  .canvas-tools{position:absolute;z-index:4;right:18px;bottom:18px;display:flex;align-items:center;gap:4px;padding:5px;background:#fffdf9;border:1px solid #e8dfd1;box-shadow:0 6px 18px #69553c14;border-radius:12px}.canvas-tools button{background:transparent;border:0;min-width:33px;height:30px;color:#796d5f;font-size:12px;font-weight:650;border-radius:7px;padding:0 6px}.canvas-tools button:hover{background:#f3eadf;color:#86563e}.canvas-tools .separator{height:18px;width:1px;background:#e8dfd1;margin:0 2px}.canvas-tools .zoom-label{font-size:11px;min-width:42px;color:#85796b;text-align:center;font-variant-numeric:tabular-nums}
  .map-bottom{position:absolute;left:20px;bottom:24px;z-index:2;display:flex;align-items:center;gap:13px;color:#aaa092;font-size:11px;pointer-events:none}.map-bottom span{display:flex;align-items:center;gap:6px}.map-bottom svg{width:13px;height:13px}
  .legend{position:absolute;bottom:19px;left:20px;display:flex;gap:14px;z-index:2;background:rgba(250,247,239,.8);padding:9px 12px;border-radius:9px;pointer-events:none}.legend-item{font-size:12px;color:#999080;display:flex;align-items:center;gap:6px}.legend-line{width:19px;height:0;border-top:2px solid #91a694;position:relative}.legend-line:after{content:"";position:absolute;right:-1px;top:-4px;border-left:5px solid #91a694;border-top:3px solid transparent;border-bottom:3px solid transparent}.legend-line.secondary{border-top:2px dashed #b79a78}.legend-line.secondary:after{border-left-color:#b79a78}
  .inspector{position:absolute;z-index:10;right:16px;top:16px;bottom:69px;width:320px;max-width:calc(100% - 32px);background:#fffefa;border:1px solid #e3d9c9;border-radius:15px;box-shadow:0 20px 65px #5946302b,0 2px 5px #5946300c;display:flex;flex-direction:column;transform:translateX(calc(100% + 30px));opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.22,.8,.2,1),opacity .2s;overflow:hidden}
  .inspector.open{transform:translateX(0);opacity:1;pointer-events:auto}.inspector-head{padding:20px 19px 14px;border-bottom:1px solid #ece5d9;flex-shrink:0}.inspector-flag{font-size:10px;color:#a27e62;font-weight:700;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}.inspector-flag button{border:0;background:transparent;color:#9b9285;font-size:20px;line-height:1;cursor:pointer}.inspector h2{font-size:22px;margin:11px 0 8px;line-height:1.25;letter-spacing:-.3px}.inspector-intro{font-size:14px;line-height:1.85;color:#897f72}.inspector-body{padding:17px 19px;overflow:auto;flex:1;scrollbar-width:thin;scrollbar-color:#e0d7c8 transparent}.detail-section{margin-bottom:20px}.detail-label{font-size:11px;font-weight:760;color:#9b7257;letter-spacing:.5px;margin-bottom:9px;display:flex;gap:8px;align-items:center}.detail-label:before{content:"";width:4px;height:12px;background:#c9a184;border-radius:3px}.detail-body{font-size:14px;line-height:1.9;color:#61574c;white-space:pre-line}.formula{background:#f5f0e6;border:1px solid #ece2d2;border-radius:9px;padding:14px 12px;font-family:Georgia,"Times New Roman",serif;font-size:16px;color:#675542;text-align:center;line-height:1.5}.example-card{font-size:14px;line-height:1.85;padding:12px;background:#f2f5ef;border:1px solid #e4ebdf;border-radius:10px;color:#5e7260}.note-card{font-size:14px;line-height:1.8;padding:12px;background:#fbf5e9;border:1px solid #efe4cb;border-radius:10px;color:#89704c}.detail-footer{flex-shrink:0;border-top:1px solid #ece5d9;padding:13px 17px;display:flex;gap:8px}.detail-footer .btn{flex:1}
  .toast{position:absolute;z-index:30;left:50%;bottom:65px;transform:translate(-50%,12px);padding:10px 15px;border-radius:9px;background:#49433b;color:white;font-size:12px;opacity:0;pointer-events:none;transition:opacity .55s ease,transform .55s ease;white-space:normal;max-width:calc(100% - 28px);text-align:center;min-width:180px}.toast.on{opacity:1;transform:translate(-50%,0)}
  .search-overlay{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;background:rgba(45,38,28,.28);backdrop-filter:blur(4px);padding-top:min(20vh,160px)}.search-overlay.open{display:flex}.search-modal{background:#fffefa;border:1px solid #dcd2c3;border-radius:15px;box-shadow:0 30px 90px #43352140;width:460px;max-width:calc(100% - 30px);overflow:hidden}.search-modal-head{padding:15px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ebe4d9}.search-modal-head svg{width:18px;color:#a8866c}.search-modal-head input{outline:0;border:0;flex:1;font-size:14px;color:#54483c;background:transparent}.search-list{max-height:320px;overflow:auto;padding:8px}.search-item{width:100%;border:0;background:transparent;text-align:left;padding:12px;display:flex;align-items:center;gap:11px;border-radius:8px;cursor:pointer}.search-item:hover{background:#f5eee3}.search-item strong{font-size:12px;color:#53493f}.search-item small{display:block;font-size:11px;color:#aa9e90;margin-top:3px}.search-empty{padding:25px 16px;font-size:12px;color:#aa9e90;text-align:center}
  .footerline{position:absolute;z-index:2;right:17px;top:19px;font-size:10px;letter-spacing:1px;color:#b4a895;font-weight:650}
  @media(max-width:1180px){.map-header{padding:17px}.count-pill{display:none}}
  /* Desktop application sidebar: responsive toolbar without mobile-specific sheets. */
  @media(max-width:920px){.shell{padding:8px}.head-title h1{font-size:22px}.head-tools .button-caption{display:none}.inspector{width:295px}}
  .head-tools .btn svg{width:16px;height:16px;flex-shrink:0}
  .eyebrow{font-size:11px;font-weight:740;letter-spacing:1.35px;color:#b19c83;text-transform:uppercase}
  .graph-guide{position:absolute;left:20px;bottom:66px;z-index:2;color:#9f9383;font-size:12px;pointer-events:none;background:rgba(255,252,246,.8);padding:6px 10px;border-radius:8px}

  /* DSH sidebar control surfaces */
  .btn{display:inline-flex;justify-content:center;align-items:center;gap:7px;min-height:35px;padding:8px 12px;border:1px solid #e3d8ca;border-radius:9px;background:#fffdf8;color:#6b5b4c;font-size:12px;font-weight:650;white-space:nowrap;transition:background .17s,border-color .17s,transform .17s}
  .btn:hover{background:#f5ede1;border-color:#d4bba7}.btn:active{transform:translateY(1px)}.btn.primary{background:#8d6a55;color:#fffdfa;border-color:#8d6a55}.btn.primary:hover{background:#78513d}.btn:disabled{opacity:.45;cursor:default}
  .node{z-index:2}.node:hover,.node:focus-within{z-index:8}
  .detail-footer{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px!important}
  .detail-footer .btn{min-height:37px;font-size:13px;min-width:0}
  .detail-footer .btn.subtle{background:#fbf8f2;color:#8b7866}
  .inspector-body,.inspector-intro{-webkit-user-select:text;user-select:text}
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important}}

  /* Minimal sidebar: retain content and navigation, omit duplicated helper descriptions. */
  .depth-pill{font-size:12px;color:#865f47;font-weight:740;background:#f7efe6;border:1px solid #e9d7c4;border-radius:99px;padding:8px 12px;white-space:nowrap}
  .map-header .head-title h1{margin:4px 0 7px}
  .crumbbar{margin-top:7px;min-height:24px;gap:3px}
  .crumb{font-size:13px;padding:5px 6px;border-radius:6px}
  .crumb.current{background:#f4eadf;color:#855e48}
  .group-area{background:rgba(255,253,248,.38)}
  .node{touch-action:none}
  .node.dragging,.node.dragging:hover{cursor:grabbing;z-index:12;transform:none;transition:none;box-shadow:0 16px 36px #604b3426,0 0 0 3px var(--node-wash)}
  .map-wrap.transitioning{cursor:progress}
  .map-wrap.transitioning .map-scene:not(.transition-ghost){pointer-events:none}
  .node-action-dock{position:absolute;z-index:40;width:152px;display:flex;flex-direction:column;gap:2px;padding:5px;border-radius:9px;border:1px solid #dfd2c2;background:#fffdf9;box-shadow:0 13px 30px #60503a29;opacity:0;transform:translateY(4px) scale(.985);transform-origin:top left;pointer-events:none;transition:opacity .15s ease,transform .15s ease}
  .node-action-dock.visible{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
  .node-action-dock button{width:100%;display:flex;align-items:center;gap:9px;min-height:31px;border:0;border-radius:6px;background:transparent;color:#6e5947;padding:6px 9px;font-size:12px;font-weight:650;white-space:nowrap;cursor:pointer;text-align:left}
  .node-action-dock button:last-child{background:transparent;color:#895d45}
  .node-action-dock button:hover,.node-action-dock button:last-child:hover{background:#f2e9dc;filter:none}
  .detail-footer{grid-template-columns:repeat(2,minmax(0,1fr))}
  .map-wrap.transitioning .node-action-dock{display:none}

</style>

<body>
<div class="shell">
<div class="workspace">
<main class="main" id="mainPanel">
    <section class="map-header">
      <div class="head-top"><div class="head-title"><h1 id="viewTitle">原子光谱与角动量</h1></div>
      <div class="head-tools"><button id="globalSearch" class="btn search-action" title="搜索知识 (Ctrl/⌘ + K)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 4 4"/></svg><span class="button-caption">查找知识</span></button><button id="exportBtn" class="btn" title="导出当前知识图"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v11m-4-4 4 4 4-4M5 16v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg><span class="button-caption">导出</span></button><span class="depth-pill" id="depthPill">第 1 / 3 层</span><button class="btn" id="viewNote" title="查看当前知识模块的详细笔记" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span class="button-caption">本节笔记</span></button><button class="btn" id="backBtn" title="返回上一层" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg><span class="button-caption">上一级</span></button></div></div>
      <nav class="crumbbar" id="breadcrumbs" aria-label="知识图谱层级"><button class="crumb current">01 课程总览</button></nav>
    </section>
    <section class="map-wrap" id="mapWrap" aria-label="可交互知识地图，右键节点打开操作菜单"><div class="map-scene" id="mapScene"></div>
      
      
      <div class="legend"><span class="legend-item"><i class="legend-line"></i> 概念依赖</span><span class="legend-item"><i class="legend-line secondary"></i> 补充 / 对比</span></div>
      <div class="canvas-tools"><button id="zoomOut" title="缩小">−</button><span class="zoom-label" id="zoomValue">100%</span><button id="zoomIn" title="放大">+</button><span class="separator"></span><button id="zoomFit" title="适应视图">适配</button></div>
      <aside id="inspector" class="inspector" aria-label="知识节点详情"><div class="inspector-head"><div class="inspector-flag"><span>知识笔记</span><button id="closeInspector" title="关闭详情" aria-label="关闭详情">×</button></div><h2 id="inspectTitle"></h2><div class="inspector-intro" id="inspectIntro"></div></div><div class="inspector-body" id="inspectBody"></div><div class="detail-footer"><button class="btn subtle" id="copyDetail">复制笔记</button><button class="btn subtle" id="inspectAction">定位节点</button></div></aside>
      <div class="node-action-dock" id="nodeActionDock" role="menu" aria-label="知识内容操作"><button id="dockAdd" type="button" role="menuitem"><span>＋</span>添加到正文</button><button id="dockAsk" type="button" role="menuitem"><span>✦</span>提问 DSH</button></div><div class="toast" id="toast" role="status"></div>
    </section>
  </main>
</div></div>
<div class="search-overlay" id="searchOverlay"><div class="search-modal" role="dialog" aria-modal="true" aria-label="查找知识点"><div class="search-modal-head"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></svg><input id="searchInput" placeholder="搜索 LS 耦合、洪特规则、公式、例题……" autocomplete="off"/><button class="btn ghost" id="closeSearch" style="font-size:10px">ESC</button></div><div class="search-list" id="searchResults"></div></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);

// Port allocation is edge-driven, so *every* incoming and outgoing relation
// terminates at an explicit dot. Multiple relations on the same side get
// separate ports ordered by the other endpoint, rather than overlapping.
function createConnections(edges){
  const portGroups=new Map(),segments=[];
  function register(nodeId,side,other,edgeIndex,role,type){
    const key=nodeId+':'+side;
    if(!portGroups.has(key))portGroups.set(key,[]);
    const port={nodeId,side,other,edgeIndex,role,type,x:0,y:0};
    portGroups.get(key).push(port);
    return port;
  }
  edges.forEach(([from,to,type,label],edgeIndex)=>{
    const a=sceneNodes[from],b=sceneNodes[to];
    if(!a||!b)return;
    const dx=(b.x+b.w/2)-(a.x+a.w/2);
    const dy=(b.y+b.h/2)-(a.y+a.h/2);
    const vertical=Math.abs(dy)>Math.abs(dx)*.55;
    const sideA=vertical?(dy>=0?'bottom':'top'):(dx>=0?'right':'left');
    const sideB=vertical?(dy>=0?'top':'bottom'):(dx>=0?'left':'right');
    const source=register(from,sideA,to,edgeIndex,'out',type);
    const target=register(to,sideB,from,edgeIndex,'in',type);
    segments.push({source,target,type,label,vertical});
  });
  // Independently distribute incoming/outgoing ports for each of the four sides.
  for(const group of portGroups.values()){
    const side=group[0].side,verticalSide=(side==='left'||side==='right');
    const axis=n=>{
      const o=sceneNodes[n.other];
      return verticalSide?o.y+o.h/2:o.x+o.w/2;
    };
    group.sort((a,b)=>axis(a)-axis(b)||a.edgeIndex-b.edgeIndex);
    const node=sceneNodes[group[0].nodeId];
    const length=verticalSide?node.h:node.w;
    // Center every port group, with even fixed spacing instead of spreading
    // sockets over the whole edge. Keep a consistent inset for dense groups.
    const inset=verticalSide?14:20;
    const preferredStep=verticalSide?17:24;
    const count=group.length;
    const step=count>1?Math.min(preferredStep,(length-2*inset)/(count-1)):0;
    const start=length/2-step*(count-1)/2;
    group.forEach((p,index)=>{
      const point=start+step*index;
      p.x=node.x+(side==='left'?0:side==='right'?node.w:point);
      p.y=node.y+(side==='top'?0:side==='bottom'?node.h:point);
    });
  }
  let svg=`<svg class="edges" viewBox="0 0 ${WIDTH} ${HEIGHT}" aria-hidden="true"><defs><marker id="arrow-main" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#92a797"/></marker><marker id="arrow-alt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0a385"/></marker></defs>`;
  for(const {source:a,target:b,type,label,vertical} of segments){
    const secondary=type==='sub';
    // Stop the arrow slightly before the target's visible input socket.
    const stop=4.5;
    const ex=b.x+(b.side==='left'?-stop:b.side==='right'?stop:0);
    const ey=b.y+(b.side==='top'?-stop:b.side==='bottom'?stop:0);
    let d;
    if(vertical){const mid=(a.y+ey)/2;d=`M${a.x} ${a.y} C${a.x} ${mid} ${ex} ${mid} ${ex} ${ey}`}
    else{const mid=(a.x+ex)/2;d=`M${a.x} ${a.y} C${mid} ${a.y} ${mid} ${ey} ${ex} ${ey}`}
    svg+=`<path class="edge ${secondary?'secondary':''}" d="${d}" stroke="${secondary?'#c0a385':'#91a796'}" marker-end="url(#${secondary?'arrow-alt':'arrow-main'})"/>`;
    if(label)svg+=`<text class="edge-label" x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-8}" text-anchor="middle">${esc(label)}</text>`;
  }
  svg+='</svg>';
  const portsByNode=new Map();
  for(const group of portGroups.values())for(const p of group){
    const node=sceneNodes[p.nodeId];
    const px=p.x-node.x,py=p.y-node.y;
    const dot=`<span class="node-port ${p.role}" data-edge="${p.edgeIndex}" data-side="${p.side}" style="left:${px}px;top:${py}px" aria-hidden="true"></span>`;
    if(!portsByNode.has(p.nodeId))portsByNode.set(p.nodeId,[]);
    portsByNode.get(p.nodeId).push(dot);
  }
  return {svg,portsByNode,segments};
}

  const wrapRect=wrap.getBoundingClientRect();
  const nodeRect=sourceEl?.getBoundingClientRect();
  const old={zoom,tx,ty};cameraCache[current]={zoom,tx,ty,autoFit};
  closeInspector();hideDock();
  navLock=true;wrap.classList.add('transitioning');
  scene.style.transition='none';

  // Briefly push the old map toward the chosen node, then fade it out.
  // The new map is not rendered until the old map is fully invisible.
  const anchorX=nodeRect?nodeRect.left-wrapRect.left+nodeRect.width/2:wrapRect.width/2;
  const anchorY=nodeRect?nodeRect.top-wrapRect.top+nodeRect.height/2:wrapRect.height/2;
  const ratio=goingBack?.99:1.026;
  const endX=anchorX-(anchorX-old.tx)*ratio;
  const endY=anchorY-(anchorY-old.ty)*ratio;
  const exitAnimation=scene.animate([
    {transform:`translate(${old.tx}px,${old.ty}px) scale(${old.zoom})`,opacity:1},
    {transform:`translate(${endX}px,${endY}px) scale(${old.zoom*ratio})`,opacity:0}
  ],{duration:180,easing:'cubic-bezier(.32,0,.7,1)',fill:'forwards'});
  activeTransition=exitAnimation;
  try{await exitAnimation.finished}catch(e){}
  scene.style.opacity='0';
  exitAnimation.cancel();

  // Atomically swap the map while fully transparent and set its final camera.
  // In particular, do not animate its transform: that was causing the shake.
  current=id;trail=nextTrail;draw();initialCamera();
  const enterAnimation=scene.animate([
    {opacity:0},{opacity:1}
  ],{duration:320,easing:'cubic-bezier(.2,.65,.25,1)',fill:'forwards'});
  activeTransition=enterAnimation;
  try{await enterAnimation.finished}catch(e){}
  scene.style.opacity='1';
  enterAnimation.cancel();activeTransition=null;
  navLock=false;wrap.classList.remove('transitioning');
  requestAnimationFrame(()=>{if(!navLock)scene.style.transition='transform .45s cubic-bezier(.22,.8,.2,1),opacity .22s'});
}
function onNode(id){const n=N[id];if(!n)return;if(n.drill&&VIEW[n.drill]&&n.drill!==current){navigate(n.drill,{sourceId:id})}else openInspector(id)}
function openInspector(id){const n=N[id];if(!n)return;inspectId=id;$('inspectTitle').textContent=n.title;$('inspectIntro').textContent=n.intro;const sections=[['核心理解',n.body,'body'],['关键公式 / 规则',n.formula,'formula'],['典型示例',n.example,'example-card'],['学习提醒',n.tip,'note-card']];$('inspectBody').innerHTML=sections.map(([title,text,cl])=>`<section class="detail-section"><div class="detail-label">${esc(title)}</div><div class="${cl==='body'?'detail-body':cl}">${esc(text)}</div></section>`).join('');const has=n.drill&&VIEW[n.drill]&&current!==n.drill;$('inspectAction').textContent=has?'进入子图 →':'在地图中定位';$('inspector').classList.add('open');$('inspectAction').onclick=()=>{if(has)navigate(n.drill);else{const el=scene.querySelector(`[data-node="${id}"]`);if(el){scene.querySelectorAll('.node.selected').forEach(e=>e.classList.remove('selected'));el.classList.add('selected');focusNode(id)}else toast('当前层级未展示此知识点，可用搜索跳转')}}}
function closeInspector(){$('inspector').classList.remove('open');inspectId=null}
function focusNode(id){const a=sceneNodes[id];if(!a)return;const b=wrap.getBoundingClientRect(),cx=a.x+a.w/2,cy=a.y+a.h/2;const desired=Math.min(1.4,Math.max(zoom,1.05));zoom=desired;tx=b.width*.46-cx*zoom;ty=b.height*.5-cy*zoom;autoFit=false;applyTransform()}
function toast(message){const el=$('toast');el.textContent=message;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),3900)}
$('zoomIn').addEventListener('click',()=>changeZoom(1.2));$('zoomOut').addEventListener('click',()=>changeZoom(1/1.2));$('zoomFit').addEventListener('click',fit);$('backBtn').addEventListener('click',()=>{if(trail.length>1)navigate(trail[trail.length-2],{back:true})});$('closeInspector').addEventListener('click',closeInspector);$('viewNote').addEventListener('click',()=>{const id=currentView().center;if(id)openInspector(id)});
// All DSH integration controls are intentionally non-operational demonstrations.
function demoDSH(action,value,kind){const preview=String(value).replace(/\s+/g,' ').slice(0,42);toast(action==='add'?`演示：将${kind}「${preview}」添加到 DSH 正文`:`演示：向 DSH 提问「${preview}」`)}
function selectionInInspector(){
  const sel=window.getSelection();if(!sel||sel.isCollapsed||!sel.toString().trim())return null;
  const ins=$('inspector');
  if(!ins.contains(sel.anchorNode)||!ins.contains(sel.focusNode))return null;
  return sel;
}
$('inspector').addEventListener('contextmenu',e=>{
  const sel=selectionInInspector();
  if(!sel||e.target.closest('button'))return;
  const r=sel.getRangeAt(0).getBoundingClientRect();
  if(e.clientX<r.left-3||e.clientX>r.right+3||e.clientY<r.top-3||e.clientY>r.bottom+3)return;
  e.preventDefault();showDock({kind:'文字',value:sel.toString().trim()},e.clientX,e.clientY);
});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#nodeActionDock'))hideDock()});
$('copyDetail').addEventListener('click',async()=>{if(!inspectId)return;const n=N[inspectId];let val=[n.title,n.intro,n.body,'关键公式：'+n.formula,'例题：'+n.example,'提醒：'+n.tip].join('\n\n');try{await navigator.clipboard.writeText(val);toast('知识笔记已复制')}catch(e){const t=document.createElement('textarea');t.value=val;document.body.append(t);t.select();try{document.execCommand('copy');toast('知识笔记已复制')}catch(e2){toast('复制失败，请检查浏览器权限')}t.remove()}});
wrap.addEventListener('pointerdown',e=>{if(e.target.closest('.node,.inspector,.canvas-tools,.node-action-dock'))return;if(e.button!==0&&e.button!==1)return;panning={x:e.clientX,y:e.clientY,tx,ty};wrap.classList.add('grabbing');wrap.setPointerCapture(e.pointerId);scene.style.transition='none'});
wrap.addEventListener('pointermove',e=>{if(!panning)return;tx=panning.tx+e.clientX-panning.x;ty=panning.ty+e.clientY-panning.y;autoFit=false;applyTransform()});
function stopPan(){if(!panning)return;panning=null;wrap.classList.remove('grabbing');scene.style.transition='transform .45s cubic-bezier(.22,.8,.2,1),opacity .22s'}wrap.addEventListener('pointerup',stopPan);wrap.addEventListener('pointercancel',stopPan);
wrap.addEventListener('wheel',e=>{if(e.target.closest('.inspector'))return;e.preventDefault();const r=wrap.getBoundingClientRect();scene.style.transition='none';changeZoom(e.deltaY<0?1.10:.9,{x:e.clientX-r.left,y:e.clientY-r.top});clearTimeout(wrap._wheel);wrap._wheel=setTimeout(()=>scene.style.transition='transform .45s cubic-bezier(.22,.8,.2,1),opacity .22s',140)},{passive:false});
$('exportBtn').addEventListener('click',()=>{const view=currentView(),data={title:view.title,view:current,nodes:view.nodes.map(([id,x,y,w])=>({id,...N[id],x,y,width:w})),relationships:view.edges.map(([from,to,type])=>({from,to,type})),groups:view.groups};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`知识地图-${current}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('当前层级的知识地图已导出')});
function allSearchNodes(){const ids=new Set();Object.keys(VIEW).forEach(k=>VIEW[k].nodes.forEach(([id])=>ids.add(id)));return [...ids]}
function renderSearch(){const val=$('searchInput').value.trim().toLowerCase(),ids=allSearchNodes().filter(id=>!val||`${N[id].title} ${N[id].short} ${N[id].intro}`.toLowerCase().includes(val)).slice(0,12);$('searchResults').innerHTML=ids.length?ids.map(id=>`<button class="search-item" data-result="${id}"><span style="width:30px;height:30px;border-radius:9px;background:${pal[N[id].type].wash};color:${pal[N[id].type].color};display:grid;place-items:center">${svgIcon(N[id].icon)}</span><span><strong>${esc(N[id].title)}</strong><small>${esc(N[id].short)}</small></span></button>`).join(''):'<div class="search-empty">没有找到相关节点</div>';$('searchResults').querySelectorAll('[data-result]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.result;closeSearch();let target=null;if(N[id].drill&&VIEW[N[id].drill])target=N[id].drill;else{target=Object.keys(VIEW).find(k=>VIEW[k].nodes.some(v=>v[0]===id))||'root'}navigate(target);setTimeout(()=>{openInspector(id);if(sceneNodes[id]&&!N[id].drill){scene.querySelector(`[data-node="${id}"]`)?.classList.add('selected')}},390)}))}
function openSearch(){$('searchOverlay').classList.add('open');$('searchInput').value='';renderSearch();$('searchInput').focus()}function closeSearch(){$('searchOverlay').classList.remove('open')}
$('globalSearch').addEventListener('click',openSearch);$('searchInput').addEventListener('input',renderSearch);$('closeSearch').addEventListener('click',closeSearch);$('searchOverlay').addEventListener('click',e=>{if(e.target===$('searchOverlay'))closeSearch()});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape'){hideDock();closeSearch();closeInspector()}});
const ro=new ResizeObserver(()=>{if(autoFit&&!navLock)fit()});ro.observe(wrap);draw();requestAnimationFrame(initialCamera);
})();
</script>
